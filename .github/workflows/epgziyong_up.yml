name: EPG 自动生成

on:
  schedule:
    # 每天北京时间 08:00 自动执行（UTC 00:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 PHP 环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, xml, sqlite3, zlib, dom, libxml
          coverage: none

      - name: 验证 PHP 环境
        run: |
          php -v
          php -m

      - name: 运行 EPG 生成脚本
        run: php epg.php

      - name: 配置 Git 用户
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: 提交生成结果
        run: |
          # 只添加实际存在的目录/文件，避免路径不存在报错
          git add -f xml/ db/ logs/ 2>/dev/null || true
          
          # 检查是否有变更，无变更则跳过提交
          if git diff --cached --quiet; then
            echo "无更新内容，跳过提交"
            exit 0
          fi
          
          git commit -m "自动更新 EPG 数据 $(date '+%Y-%m-%d %H:%M')"
          git push


name: Logo Update

env:
  TZ: Asia/Shanghai
  LOGO_DIR: "logo"
  FILE_EXT: "png"
  MIN_FILE_SIZE: "1k"
  CLONE_RETRY: 2          # 仓库克隆失败重试次数，应对网络波动
  FORCE_LOWERCASE: false  # 是否强制统一文件名为小写（彻底解决大小写重复问题）
  MAX_TIMEOUT: 30         # 供脚本内部使用，作业超时请直接修改下方 timeout-minutes

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5'  # 每周五UTC 0点 / 北京时间8点自动执行

jobs:
  sync-logo:
    runs-on: ubuntu-22.04
    timeout-minutes: 30   # 修复：作业级超时直接写死数值，不支持 env 变量
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 初始化环境与统计基线
        run: |
          mkdir -p "$LOGO_DIR"
          echo "WORKSPACE=$(pwd)" >> $GITHUB_ENV
          echo "INIT_COUNT=$(find "$LOGO_DIR" -name "*.$FILE_EXT" -type f | wc -l)" >> $GITHUB_ENV

      - name: 同步Logo文件（优先级分层+失败重试）
        run: |
          set -euo pipefail

          # ==============================================
          # 台标源优先级分层（从上到下优先级递减）
          # 格式：仓库URL|源目录列表(逗号分隔)|分支名(可省略，自动检测)
          # 同名台标仅保留最先匹配到的版本，实现优先级生效
          # ==============================================
          REPOS=(
            # === 第一梯队：核心国内源（中文命名匹配度最高、画质最优，优先保留）===
            "https://github.com/taksssss/tv|icon"
            "https://github.com/wind005/TVlive|LOGO"
            "https://github.com/fanmingming/live|tv"
            "https://github.com/suxuang/myIPTV|img,tvlog"

            # === 第二梯队：全量补充源（覆盖更多频道，补全核心源缺失内容）===
            "https://github.com/mytv-android/myTVlogo|img"
            "https://github.com/kuwoliu/IPTV-Logo|logo"
            "https://github.com/Clours-yang/TVbox-logo|logos"
            "https://github.com/iptv-org/logos|logos"

            # === 第三梯队：备用兜底源（地方频道、境外频道、工具配套补充）===
            "https://github.com/zzzz0317/beijing-unicom-iptv-playlist|img"
            "https://github.com/sumingyd/IPTV-Scanner-Editor-Pro|logo"
            "https://github.com/ngc7293/IPTV-Logo|png"
            "https://github.com/lizongying/my-tv-logo|images"
          )

          NEW_COUNT=0
          TEMP_ROOT=$(mktemp -d)

          # 通用重试函数：网络操作失败自动重试
          retry_cmd() {
            local max_retries=$CLONE_RETRY
            local attempt=1
            while [ $attempt -le $max_retries ]; do
              if "$@"; then
                return 0
              fi
              if [ $attempt -lt $max_retries ]; then
                echo "⚠️  命令执行失败，第 $attempt 次重试中..."
                sleep 2
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          for REPO in "${REPOS[@]}"; do
            IFS='|' read -r URL SRC_DIRS BRANCH <<< "$REPO"
            REPO_HASH=$(echo "$URL" | md5sum | cut -c1-8)
            TEMP_DIR="$TEMP_ROOT/repo_$REPO_HASH"
            REPO_NAME=$(basename "$URL" .git)

            echo "======================================"
            echo "📦 正在处理仓库: $REPO_NAME"

            # 自动检测默认分支：优先使用指定分支，否则自动获取远程默认分支
            if [ -z "${BRANCH:-}" ]; then
              BRANCH=$(git ls-remote --symref "$URL" HEAD 2>/dev/null | grep '^ref:' | awk '{print $2}' | sed 's|refs/heads/||')
              BRANCH=${BRANCH:-main}
            fi
            echo "🔖 使用分支: $BRANCH"

            # 浅克隆 + 无检出 + Blob过滤，最小化下载体积
            if ! retry_cmd git clone --depth 1 --filter=blob:none --no-checkout --branch "$BRANCH" "$URL" "$TEMP_DIR" 2>/dev/null; then
              echo "❌ 仓库克隆失败，跳过"
              continue
            fi

            cd "$TEMP_DIR"
            git sparse-checkout init --cone 2>/dev/null || true

            IFS=',' read -ra DIR_LIST <<< "$SRC_DIRS"
            DIR_SUCCESS=0
            for DIR in "${DIR_LIST[@]}"; do
              DIR=$(echo "$DIR" | xargs)

              # 快速校验目录是否存在，不存在直接跳过
              if ! git ls-tree HEAD "$DIR" &>/dev/null; then
                echo "  📂 目录 $DIR 不存在，跳过"
                continue
              fi

              # 稀疏检出指定目录
              if ! retry_cmd git sparse-checkout set "$DIR" 2>/dev/null; then
                echo "  📂 目录 $DIR 检出失败，跳过"
                continue
              fi
              if ! retry_cmd git checkout 2>/dev/null; then
                echo "  📂 目录 $DIR 检出失败，跳过"
                continue
              fi

              # 批量复制符合条件的台标文件
              while IFS= read -r -d '' file; do
                filename=$(basename "$file")
                # 可选：强制统一文件名小写，解决大小写重复
                if [ "$FORCE_LOWERCASE" = "true" ]; then
                  filename=$(echo "$filename" | tr '[:upper:]' '[:lower:]')
                fi
                target="$WORKSPACE/$LOGO_DIR/$filename"

                # 同名文件不覆盖，保证高优先级源生效
                if [ ! -f "$target" ]; then
                  cp -f "$file" "$target"
                  NEW_COUNT=$((NEW_COUNT + 1))
                fi
              done < <(find "$DIR" -name "*.$FILE_EXT" -type f -size +"$MIN_FILE_SIZE" -print0 2>/dev/null)

              DIR_SUCCESS=$((DIR_SUCCESS + 1))
            done

            echo "✅ 处理完成，有效目录: $DIR_SUCCESS/${#DIR_LIST[@]}"
            cd "$WORKSPACE"
          done

          # 收尾清理：删除过小无效文件 + 清理空目录
          find "$LOGO_DIR" -type f -name "*.$FILE_EXT" ! -size +"$MIN_FILE_SIZE" -delete 2>/dev/null
          find "$LOGO_DIR" -type d -empty -delete 2>/dev/null
          rm -rf "$TEMP_ROOT"

          # 统计结果写入环境变量，供后续步骤使用
          FINAL_COUNT=$(find "$LOGO_DIR" -name "*.$FILE_EXT" -type f | wc -l)
          echo "NEW_COUNT=$NEW_COUNT" >> $GITHUB_ENV
          echo "FINAL_COUNT=$FINAL_COUNT" >> $GITHUB_ENV

          echo ""
          echo "======================================"
          echo "📊 同步完成统计"
          echo "   原有台标数: $INIT_COUNT"
          echo "   新增台标数: $NEW_COUNT"
          echo "   当前总台标数: $FINAL_COUNT"
          echo "======================================"

      - name: 暂存文件
        run: git add "$LOGO_DIR"/*.$FILE_EXT 2>/dev/null || true
        continue-on-error: true

      - name: 提交并推送更新
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --name-only | grep -q .; then
            git fetch origin main
            git commit -m "频道台标更新: $(date +'%Y-%m-%d %H:%M') (CST) | 新增${NEW_COUNT}个，共${FINAL_COUNT}个"
            git push origin HEAD:$GITHUB_REF_NAME --force
            echo "✅ 推送完成，本次新增 ${NEW_COUNT} 个台标"
          else
            echo "ℹ️ 无文件变更，跳过提交"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 最终清理
        if: always()
        run: rm -rf temp_* .temp_* /tmp/tmp.* 2>/dev/null

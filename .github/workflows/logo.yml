name: Logo Update

env:
  TZ: Asia/Shanghai
  LOGO_DIR: "logo"
  FILE_EXT: "png"
  MIN_FILE_SIZE: "1k"
  CLONE_RETRY: 2
  FORCE_LOWERCASE: false

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5'

jobs:
  sync-logo:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 初始化环境与统计基线
        run: |
          mkdir -p "$LOGO_DIR"
          echo "WORKSPACE=$(pwd)" >> $GITHUB_ENV
          echo "INIT_COUNT=$(find "$LOGO_DIR" -name "*.$FILE_EXT" -type f | wc -l)" >> $GITHUB_ENV

      - name: 同步Logo文件（全容错+优先级分层）
        run: |
          set -euo pipefail

          # ==============================================
          # 台标源优先级分层（从上到下优先级递减）
          # 格式：仓库URL|源目录列表(逗号分隔)|分支名(可省略)
          # ==============================================
          REPOS=(
            # === 第一梯队：核心高画质源 ===
            "https://github.com/taksssss/tv|icon"
            "https://github.com/wind005/TVlive|LOGO"
            "https://github.com/fanmingming/live|tv"
            "https://github.com/suxuang/myIPTV|img,tvlog"

            # === 第二梯队：全量补充源 ===
            "https://github.com/mytv-android/myTVlogo|img"
            "https://github.com/wanglindl/TVlogo|logo"
            "https://github.com/iptv-org/logos|logos"

            # === 第三梯队：兜底补充源 ===
            "https://github.com/zzzz0317/beijing-unicom-iptv-playlist|img"
            "https://github.com/sumingyd/IPTV-Scanner-Editor-Pro|logo"
            "https://github.com/ngc7293/IPTV-Logo|png"
            "https://github.com/lizongying/my-tv-logo|images"
          )

          TEMP_ROOT=$(mktemp -d)

          # 重试函数
          retry_cmd() {
            local max_retries=$CLONE_RETRY
            local attempt=1
            while [ $attempt -le $max_retries ]; do
              if "$@" 2>/dev/null; then
                return 0
              fi
              [ $attempt -lt $max_retries ] && sleep 2
              attempt=$((attempt + 1))
            done
            return 1
          }

          # 单个仓库处理函数：内部全容错，永远不会抛出非零退出码
          process_repo() {
            local REPO_LINE="$1"
            IFS='|' read -r URL SRC_DIRS BRANCH <<< "$REPO_LINE"
            local REPO_HASH=$(echo "$URL" | md5sum | cut -c1-8)
            local TEMP_DIR="$TEMP_ROOT/repo_$REPO_HASH"
            local REPO_NAME=$(basename "$URL" .git)

            echo "======================================"
            echo "📦 正在处理仓库: $REPO_NAME"

            # 修复：分支检测管道增加 || true，彻底避免 grep 无匹配触发 pipefail 退出
            if [ -z "${BRANCH:-}" ]; then
              BRANCH=$(git ls-remote --symref "$URL" HEAD 2>/dev/null | grep '^ref:' | awk '{print $2}' | sed 's|refs/heads/||' || true)
              BRANCH=${BRANCH:-main}
            fi
            echo "🔖 使用分支: $BRANCH"

            # 克隆失败直接跳过，不抛出错误
            if ! retry_cmd git clone --depth 1 --filter=blob:none --no-checkout --branch "$BRANCH" "$URL" "$TEMP_DIR"; then
              echo "❌ 仓库克隆失败，跳过"
              return 0
            fi

            cd "$TEMP_DIR"
            git sparse-checkout init --cone 2>/dev/null || true

            IFS=',' read -ra DIR_LIST <<< "$SRC_DIRS"
            local DIR_SUCCESS=0
            for DIR in "${DIR_LIST[@]}"; do
              DIR=$(echo "$DIR" | xargs)

              if ! git ls-tree HEAD "$DIR" &>/dev/null; then
                echo "  📂 目录 $DIR 不存在，跳过"
                continue
              fi

              if ! retry_cmd git sparse-checkout set "$DIR"; then
                echo "  📂 目录 $DIR 检出失败，跳过"
                continue
              fi
              if ! retry_cmd git checkout; then
                echo "  📂 目录 $DIR 检出失败，跳过"
                continue
              fi

              # 批量复制台标文件，同名不覆盖（保证优先级）
              while IFS= read -r -d '' file; do
                local filename=$(basename "$file")
                [ "$FORCE_LOWERCASE" = "true" ] && filename=$(echo "$filename" | tr '[:upper:]' '[:lower:]')
                local target="$WORKSPACE/$LOGO_DIR/$filename"

                if [ ! -f "$target" ]; then
                  cp -f "$file" "$target"
                fi
              done < <(find "$DIR" -name "*.$FILE_EXT" -type f -size +"$MIN_FILE_SIZE" -print0 2>/dev/null)

              DIR_SUCCESS=$((DIR_SUCCESS + 1))
            done

            echo "✅ 处理完成，有效目录: $DIR_SUCCESS/${#DIR_LIST[@]}"
            cd "$WORKSPACE"
            return 0
          }

          # 修复：调用函数增加 || true 双重兜底，彻底杜绝单仓库失败终止全局
          for REPO in "${REPOS[@]}"; do
            process_repo "$REPO" || true
          done

          # 收尾清理
          find "$LOGO_DIR" -type f -name "*.$FILE_EXT" ! -size +"$MIN_FILE_SIZE" -delete 2>/dev/null
          find "$LOGO_DIR" -type d -empty -delete 2>/dev/null
          rm -rf "$TEMP_ROOT"

          # 统计结果
          FINAL_COUNT=$(find "$LOGO_DIR" -name "*.$FILE_EXT" -type f | wc -l)
          NEW_COUNT=$((FINAL_COUNT - INIT_COUNT))
          [ $NEW_COUNT -lt 0 ] && NEW_COUNT=0

          echo "NEW_COUNT=$NEW_COUNT" >> $GITHUB_ENV
          echo "FINAL_COUNT=$FINAL_COUNT" >> $GITHUB_ENV

          echo ""
          echo "======================================"
          echo "📊 同步完成统计"
          echo "   原有台标数: $INIT_COUNT"
          echo "   新增台标数: $NEW_COUNT"
          echo "   当前总台标数: $FINAL_COUNT"
          echo "======================================"

      - name: 暂存文件
        run: git add "$LOGO_DIR"/*.$FILE_EXT 2>/dev/null || true
        continue-on-error: true

      - name: 提交并推送更新
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --name-only | grep -q .; then
            git fetch origin main
            git commit -m "频道台标更新: $(date +'%Y-%m-%d %H:%M') (CST) | 新增${NEW_COUNT}个，共${FINAL_COUNT}个"
            git push origin HEAD:$GITHUB_REF_NAME --force
            echo "✅ 推送完成，本次新增 ${NEW_COUNT} 个台标"
          else
            echo "ℹ️ 无文件变更，跳过提交"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 最终清理
        if: always()
        run: rm -rf temp_* .temp_* /tmp/tmp.* 2>/dev/null



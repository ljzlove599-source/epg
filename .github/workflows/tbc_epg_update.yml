name: tbc_epg

on:
  schedule:
    - cron: '21 21 * * *'   # 每天 UTC 21:00 (台北时间 05:00)
  workflow_dispatch:

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖包
        run: |
          pip install requests beautifulsoup4 pytz loguru urllib3 opencc-python-reimplemented
          # 若需要 SOCKS5 代理，请取消下面注释
          # pip install 'requests[socks]'

      - name: 执行 EPG 抓取脚本
        env:
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
          OUTPUT_DIR: ./epg      # 相对于工作空间的目录
        run: python tbc_epg.py

      - name: 提交并推送 EPG 文件
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add epg/epg_tbc.xml
          git commit -m "Auto-update TBC EPG" || echo "No changes to commit"
          git push

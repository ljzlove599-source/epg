name: 生成 TDM 澳门电视台 EPG

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    name: 生成并提交 EPG 文件

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 PHP 环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl, dom, json
          coverage: none

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 OpenCC 依赖
        run: pip install opencc-python-reimplemented

      - name: 运行 EPG 生成脚本
        run: php tdm.php

      - name: 繁体转简体
        run: python3 convert.py

      - name: 提交生成的 EPG 文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f epg/tdm.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新 TDM EPG - $(date '+%Y-%m-%d')" && git push)



name: ELTA EPG 节目单生成

on:
  schedule:
    # 每日台北时间 00:30 自动执行（对应 UTC 16:30）
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  build-epg:
    runs-on: ubuntu-latest
    name: 生成并提交 ELTA 节目单
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 配置 PHP 运行环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json, xml, mbstring
          coverage: none

      - name: 执行 EPG 生成脚本
        run: php epg_elta.php

      - name: 提交更新到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg/epg_elta.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新 ELTA EPG 节目单" && git push)

      - name: 归档产物
        uses: actions/upload-artifact@v4
        with:
          name: epg_elta.xml
          path: epg/epg_elta.xml
          retention-days: 7

name: Build EPG 4K
on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: '40 16 * * *' # UTC 16:40 = 北京时间 00:40
    - cron: '15 00 * * *' # UTC 00:15 = 北京时间 08:15
    - cron: '00 07 * * *' # UTC 07:00 = 北京时间 15:00
    - cron: '30 10 * * *' # UTC 10:30 = 北京时间 18:30

# 增加并发锁，解决你之前遇到的 fetch first 推送冲突！
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 关键！GITHUB_TOKEN 默认权限不足，不加这个 git push 会拒绝！
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 拉取完整历史，保证git提交正常

      - name: Install PHP & extensions
        run: |
          sudo apt update
          sudo apt install -y php-cli php-xml php-mbstring php-zip

      - name: Run EPG PHP script
        run: php epg_4k.php

      - name: Commit & push epg_4k.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg/epg_4k.xml logs/*.log
          git commit -m "🤖 auto update epg_4k.xml $(date '+%Y-%m-%d %H:%M:%S')" || echo "✅ 无变更，跳过提交"
          git push --force-with-lease origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload backup artifact（备份，可选）
        uses: actions/upload-artifact@v4
        with:
          name: epg-backup
          path: |
            epg/epg_4k.xml
            logs/*.log

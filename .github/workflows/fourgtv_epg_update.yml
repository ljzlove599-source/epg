name: Daily FourgTV EPG Update

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（台湾时间 08:00）
  workflow_dispatch:

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pytz loguru opencc-python-reimplemented

      - name: Create epg output directory
        run: mkdir -p epg

      - name: Run fourgtv_epg.py
        run: |
          sleep $((RANDOM % 30))
          python fourgtv_epg.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/*
          if git diff --staged --quiet; then
            echo "无变更需要提交"
          else
            git commit -m "Auto-update EPG data (epg)"
            git push
          fi

      - name: Verify output files
        if: always()
        run: |
          ls -la epg
          if [ -f epg/epg_generator.log ]; then
            cat epg/epg_generator.log
          else
            echo "警告：未找到日志文件 epg/epg_generator.log，脚本可能未正常执行完成"
          fi
          if [ -f epg/4g.xml ]; then
            echo "4g.xml 生成成功"
          else
            echo "警告：未找到目标输出文件 epg/4g.xml"
          fi

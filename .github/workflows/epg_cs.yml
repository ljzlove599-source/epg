name: EPG 自动更新程序

on:
  schedule:
    - cron: '40 16 * * *' # UTC 16:40 = 北京时间 00:40
    - cron: '00 00 * * *' # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:

# 全局统一配置
env:
  TZ: Asia/Shanghai
  EPG_OUTPUT_DIR: epg_sources
  LOG_DIR: logs
  PHP_SCRIPT_DIR: php # PHP 脚本统一目录
  PYTHON_SCRIPT_DIR: py # ✅ 新增：Python 脚本统一目录
  PHP_VERSION: '7.4'
  PYTHON_VERSION: '3.x'

jobs:
  epg_comprehensive_processing:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 拉取代码与 Git 配置 ----------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git and sync latest code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || git reset --hard origin/${{ github.ref_name }}

      # ---------- 2. 安装系统与语言环境 ----------
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq libxml2-utils gzip

      - name: Set up PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip' # 开启 pip 依赖自动缓存

      # 缓存 Composer 依赖（兼容无 composer.json 场景）
      - name: Get Composer cache directory
        id: composer-cache
        run: |
          if [ -f "composer.json" ]; then
            echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
          else
            # 不存在 composer.json 时输出占位目录，避免后续步骤报错
            echo "dir=./.composer_cache" >> $GITHUB_OUTPUT
            echo "未检测到 composer.json，跳过 Composer 缓存配置"
          fi

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install project dependencies
        run: |
          # PHP 依赖安装
          if [ -f "composer.json" ]; then
            composer install --no-dev --no-progress --no-interaction --prefer-dist
          fi
          # Python 依赖安装
          pip install opencc-python-reimplemented curl_cffi beautifulsoup4 requests aiohttp pytz loguru httpx
          echo "所有依赖安装完成"

      # ---------- 3. 清理历史残留文件 ----------
      - name: Clean old output files
        run: |
          # 安全清理：仅当目录存在时执行删除
          if [ -d "${EPG_OUTPUT_DIR}" ]; then
            rm -f ${EPG_OUTPUT_DIR}/*.xml ${EPG_OUTPUT_DIR}/*.xml.gz
          fi
          rm -f *_time.txt time.txt
          rm -rf ${LOG_DIR}/
          mkdir -p ${LOG_DIR} ${EPG_OUTPUT_DIR}
          echo "历史文件清理完成，输出目录：${EPG_OUTPUT_DIR}，日志目录：${LOG_DIR}"

      # ---------- 4. 运行 Python 采集脚本 ----------
      - name: Run all Python scrapers
        id: python_scrapers
        continue-on-error: true
        run: |
          # 封装统一执行函数
          run_python_scraper() {
            local script_name=$1
            local output_file=$2
            local extra_args=$3
            local id_name=$4
            # ✅ 修正：拼接 py 目录前缀
            local script_path="${PYTHON_SCRIPT_DIR}/${script_name}"

            if [ ! -f "${script_path}" ]; then
              echo "⚠️ ${script_path} 不存在，跳过"
              echo "${id_name}_generated=false" >> $GITHUB_OUTPUT
              return 0
            fi

            echo "运行 ${script_path} 抓取脚本..."
            # ✅ 修正：使用完整路径执行脚本
            python3 ${script_path} ${extra_args} "${EPG_OUTPUT_DIR}/${output_file}"
            local exit_code=$?

            if [ ${exit_code} -eq 0 ] && [ -f "${EPG_OUTPUT_DIR}/${output_file}" ]; then
              echo "✅ 成功生成 ${output_file}"
              echo "${id_name}_generated=true" >> $GITHUB_OUTPUT
              echo "${id_name} EPG updated at $(date '+%Y-%m-%d %H:%M:%S')" > "${id_name}_time.txt"
              return 0
            else
              echo "⚠️ 生成 ${output_file} 失败（退出码：${exit_code}）"
              echo "${id_name}_generated=false" >> $GITHUB_OUTPUT
              return 1
            fi
          }

          failed_count=0
          run_python_scraper "fourgtv_epg.py" "4g.xml" "" "fourgtv" || failed_count=$((failed_count + 1))
          run_python_scraper "hami.py" "hami.xml" "$(date '+%Y-%m-%d')" "hami" || failed_count=$((failed_count + 1))
          run_python_scraper "litv_epg_merged.py" "litv_epg.xml" "$(date '+%Y-%m-%d')" "litv" || failed_count=$((failed_count + 1))
          run_python_scraper "ofiii_epg.py" "ofiii.xml" "--output" "ofiii" || failed_count=$((failed_count + 1))

          echo "python_failed_count=${failed_count}" >> $GITHUB_OUTPUT
          echo "Python 脚本执行完成，失败 ${failed_count} 个"

      # ---------- 5. 检查并运行 PHP 采集脚本（并行执行） ----------
      - name: Check PHP scripts existence
        id: check_scripts
        run: |
          echo "检查 PHP 脚本文件（目录：${PHP_SCRIPT_DIR}）..."
          declare -a scripts=(
            "51zmt_epg.php" "cntvepg.php" "epg_4k.php" "epg_elta.php"
            "kbro_epg.php" "mod.php" "nowtv_epg.php"
            "rthk.php" "tdm_epg.php" "zhongtianam.php"
          )
          existing_scripts=()
          for script in "${scripts[@]}"; do
            script_path="${PHP_SCRIPT_DIR}/${script}"
            if [ -f "$script_path" ]; then
              echo "✓ 找到文件: $script_path"
              existing_scripts+=("$script")
            else
              echo "✗ 文件不存在: $script_path"
            fi
          done
          if [ ${#existing_scripts[@]} -eq 0 ]; then
            echo "警告: 没有找到任何 PHP 脚本文件，跳过 EPG 生成"
            echo "existing_scripts=" >> $GITHUB_OUTPUT
          else
            scripts_list=$(IFS=,; echo "${existing_scripts[*]}")
            echo "existing_scripts=$scripts_list" >> $GITHUB_OUTPUT
          fi

      - name: Run PHP scripts to generate EPG XML (parallel)
        if: ${{ steps.check_scripts.outputs.existing_scripts != '' }}
        id: run_php_scripts
        continue-on-error: true
        run: |
          WORKDIR=$(pwd)
          LOG_ABS_PATH="${WORKDIR}/${LOG_DIR}"
          IFS=',' read -ra scripts <<< "${{ steps.check_scripts.outputs.existing_scripts }}"
          pids=()
          start_time=$(date +%s)

          # 切换到 PHP 脚本目录执行，保证相对路径依赖正常加载
          cd "${PHP_SCRIPT_DIR}" || exit 1

          # 后台并行启动所有脚本，日志输出到绝对路径的日志目录
          for script in "${scripts[@]}"; do
            log_name="${script%.php}"
            log_file="${LOG_ABS_PATH}/${log_name}.log"
            echo "启动脚本: $script"
            php "$script" > "$log_file" 2>&1 &
            pids+=("$!")
          done

          # 等待所有进程结束，统计结果
          failed_count=0
          for i in "${!scripts[@]}"; do
            wait ${pids[$i]}
            exit_code=$?
            script=${scripts[$i]}
            log_name="${script%.php}"
            if [ ${exit_code} -eq 0 ]; then
              echo "✓ ${log_name} 执行成功"
            else
              echo "✗ ${log_name} 执行失败（退出码：${exit_code}）"
              echo "--- 最后 20 行日志 ---"
              tail -n 20 "${LOG_ABS_PATH}/${log_name}.log" 2>/dev/null || echo "无法读取日志文件"
              echo "----------------------"
              failed_count=$((failed_count + 1))
            fi
          done

          end_time=$(date +%s)
          total_duration=$((end_time - start_time))
          echo "PHP 脚本执行完成: 成功 $((${#scripts[@]} - failed_count)) 个，失败 ${failed_count} 个，总耗时: ${total_duration}秒"
          echo "php_failed_count=${failed_count}" >> $GITHUB_OUTPUT

      # 迁移PHP生成的文件到统一输出目录
      - name: Move PHP output to EPG directory
        run: |
          # 1. 优先归集 PHP 脚本在 php/epg_sources 子目录生成的文件
          if [ -d "${PHP_SCRIPT_DIR}/${EPG_OUTPUT_DIR}" ]; then
            mv -f ${PHP_SCRIPT_DIR}/${EPG_OUTPUT_DIR}/*.xml ${EPG_OUTPUT_DIR}/ 2>/dev/null || true
            mv -f ${PHP_SCRIPT_DIR}/${EPG_OUTPUT_DIR}/*.xml.gz ${EPG_OUTPUT_DIR}/ 2>/dev/null || true
          fi
          
          # 2. 兼容直接生成在 php 根目录的文件
          mv -f ${PHP_SCRIPT_DIR}/*.xml ${EPG_OUTPUT_DIR}/ 2>/dev/null || true
          mv -f ${PHP_SCRIPT_DIR}/*.xml.gz ${EPG_OUTPUT_DIR}/ 2>/dev/null || true
          
          echo "PHP生成文件已迁移至输出目录，当前文件列表："
          ls -lh ${EPG_OUTPUT_DIR}/

      # ---------- 6. 检查生成的 XML 文件 ----------
      - name: Check generated XML files
        id: check_xml
        run: |
          # 兼容Python+PHP所有实际输出文件名
          declare -a expected_xml=(
            "4g.xml" "epg_51zmt.xml.gz"
            "cntv.xml.gz"
            "epg_4k.xml" "epg_elta.xml"
            "epg_nowtv.xml" "hami.xml" 
            "epg_zhongtianam.xml"
            "litv_epg.xml"
            "ofiii.xml" 
            "epg_rthk_tv.xml"
            "kbro_epg.xml" 
            "mod_epg.xml"
            "tdm_epg.xml"
          )

          generated_files=()
          valid_xml=0
          invalid_xml=0

          echo "开始检查生成的 XML 文件（目录：${EPG_OUTPUT_DIR}）..."
          for xml_file in "${expected_xml[@]}"; do
            file_path="${EPG_OUTPUT_DIR}/${xml_file}"
            if [ -f "$file_path" ]; then
              filesize=$(stat -c%s "$file_path" 2>/dev/null || wc -c < "$file_path" | awk '{print $1}')
              echo "✓ 生成文件: $file_path (大小: $filesize bytes)"
              generated_files+=("$file_path")

              if [[ "$xml_file" != *.gz ]]; then
                if xmllint --noout "$file_path" 2>/dev/null; then
                  echo "  ✅ XML 格式验证通过"
                  valid_xml=$((valid_xml + 1))
                else
                  echo "  ❌ XML 格式验证失败！"
                  invalid_xml=$((invalid_xml + 1))
                fi
              fi
            else
              echo "✗ 未生成文件: $file_path"
            fi
          done

          echo "已生成文件数量: ${#generated_files[@]}"
          echo "格式合法: $valid_xml 个，格式异常: $invalid_xml 个"

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "generated_xml=" >> $GITHUB_OUTPUT
          else
            xml_list=$(IFS=,; echo "${generated_files[*]}")
            echo "generated_xml=$xml_list" >> $GITHUB_OUTPUT
          fi
          echo "valid_xml_count=$valid_xml" >> $GITHUB_OUTPUT
          echo "invalid_xml_count=$invalid_xml" >> $GITHUB_OUTPUT

      # ---------- 7. 更新时间戳 ----------
      - name: Update time.txt with latest timestamp
        if: ${{ steps.check_xml.outputs.generated_xml != '' }}
        run: |
          echo "Last XML update: $(date '+%Y-%m-%d %H:%M:%S')" > time.txt
          echo "时间戳已更新: $(cat time.txt)"

      # ---------- 8. 提交结果并推送回仓库 ----------
      - name: Commit and push all generated files
        run: |
          # 提交前再次同步远端代码，避免冲突
          git pull --rebase --autostash origin ${{ github.ref_name }} || git reset --hard origin/${{ github.ref_name }}

          shopt -s nullglob
          # 收集文件
          xml_files=(${EPG_OUTPUT_DIR}/*.xml)
          gz_files=(${EPG_OUTPUT_DIR}/*.xml.gz)
          time_files=(*_time.txt)

          # 批量添加
          [ ${#xml_files[@]} -gt 0 ] && git add "${xml_files[@]}"
          [ ${#gz_files[@]} -gt 0 ] && git add "${gz_files[@]}"
          [ ${#time_files[@]} -gt 0 ] && git add "${time_files[@]}"
          [ -f time.txt ] && git add time.txt
          [ -d ${LOG_DIR}/ ] && git add ${LOG_DIR}/
          shopt -u nullglob

          if git diff --cached --quiet; then
            echo "无新增变更，跳过提交"
            exit 0
          fi

          git commit -m "bot: 更新 EPG 数据 $(date '+%Y-%m-%d %H:%M')"
          git push origin ${{ github.ref_name }}
          echo "✅ 所有生成结果已推送回仓库"

      # ---------- 9. 运行结果汇总 ----------
      - name: Run summary
        run: |
          # 变量兜底，避免步骤未执行时空值导致算术错误
          python_failed="${{ steps.python_scrapers.outputs.python_failed_count }}"
          python_failed=${python_failed:-0}
          php_failed="${{ steps.run_php_scripts.outputs.php_failed_count }}"
          php_failed=${php_failed:-0}
          valid_xml="${{ steps.check_xml.outputs.valid_xml_count }}"
          valid_xml=${valid_xml:-0}
          invalid_xml="${{ steps.check_xml.outputs.invalid_xml_count }}"
          invalid_xml=${invalid_xml:-0}

          echo "====== EPG 采集任务汇总 ======"
          echo "Python 脚本失败数: ${python_failed}"
          echo "PHP 脚本失败数: ${php_failed}"
          echo "生成 XML 文件数: ${valid_xml}"
          echo "XML 格式异常数: ${invalid_xml}"
          echo "=============================="

          total_failed=$(( python_failed + php_failed ))
          if [ ${total_failed} -ge 3 ]; then
            echo "::error::超过 3 个脚本执行失败，请检查日志"
            exit 1
          fi


name: EPG 自动更新

on:
  schedule:
    # UTC 每天 18:10 → 北京时间次日 02:10
    - cron: '10 18 * * *'
  workflow_dispatch:

# 全局统一时区与输出目录
env:
  TZ: Asia/Shanghai
  EPG_OUTPUT_DIR: epg_sources

jobs:
  epg_comprehensive_processing:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 拉取代码与 Git 配置 ----------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git and sync latest code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }}

      # ---------- 2. 安装系统与语言环境 ----------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libxml2-utils gzip

      - name: Set up PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install project dependencies
        run: |
          # PHP 依赖安装
          if [ -f "composer.json" ]; then
            composer install --no-dev --no-progress --no-interaction --prefer-dist
          fi
          # Python 依赖安装
          pip install --no-cache-dir opencc-python-reimplemented curl_cffi beautifulsoup4 requests aiohttp pytz loguru httpx
          echo "所有依赖安装完成"

      # ---------- 3. 清理历史残留文件 ----------
      - name: Clean old output files
        run: |
          rm -f ${EPG_OUTPUT_DIR}/*.xml ${EPG_OUTPUT_DIR}/*.xml.gz *_time.txt time.txt
          rm -rf logs/
          mkdir -p logs ${EPG_OUTPUT_DIR}
          echo "历史文件清理完成，输出目录：${EPG_OUTPUT_DIR}"

      # ---------- 4. 运行 Python 采集脚本 ----------
      - name: Run fourgtv EPG scraper
        id: fourgtv_epg
        continue-on-error: true
        run: |
          if [ -f "fourgtv_epg.py" ]; then
            echo "运行福建 EPG 抓取脚本..."
            python3 fourgtv_epg.py
            if [ -f "${EPG_OUTPUT_DIR}/4g.xml" ]; then
              echo "✅ 成功生成 4g.xml"
              echo "fourgtv_generated=true" >> $GITHUB_OUTPUT
              echo "fourgtv EPG updated at $(date '+%Y-%m-%d %H:%M:%S')" > fourgtv_time.txt
            else
              echo "⚠️ 未生成 4g.xml"
              echo "fourgtv_generated=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ fourgtv_epg.py 不存在，跳过"
            echo "fourgtv_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Run hami EPG scraper
        id: hami
        continue-on-error: true
        run: |
          if [ -f "hami.py" ]; then
            echo "运行hami EPG 抓取脚本..."
            python3 hami.py "$(date '+%Y-%m-%d')" hami.xml
            if [ -f "${EPG_OUTPUT_DIR}/hami.xml" ]; then
              echo "✅ 成功生成 hami.xml"
              echo "hami_generated=true" >> $GITHUB_OUTPUT
              echo "hami EPG updated at $(date '+%Y-%m-%d %H:%M:%S')" > hami_time.txt
            else
              echo "⚠️ 未生成 hami.xml"
              echo "hami_generated=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ hami.py 不存在，跳过"
            echo "hami_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Run litv EPG scraper
        id: litv
        continue-on-error: true
        run: |
          if [ -f "litv_epg_merged.py" ]; then
            echo "运行litv EPG 抓取脚本..."
            python3 litv_epg_merged.py "$(date '+%Y-%m-%d')" litv_epg.xml
            if [ -f "${EPG_OUTPUT_DIR}/litv_epg.xml" ]; then
              echo "✅ 成功生成 litv_epg.xml"
              echo "litv_generated=true" >> $GITHUB_OUTPUT
              echo "litv EPG updated at $(date '+%Y-%m-%d %H:%M:%S')" > litv_time.txt
            else
              echo "⚠️ 未生成 litv_epg.xml"
              echo "litv_generated=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ litv_epg_merged.py 不存在，跳过"
            echo "litv_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ofiii EPG scraper
        id: ofiii
        continue-on-error: true
        run: |
          if [ -f "ofiii_epg.py" ]; then
            echo "运行ofiii EPG 抓取脚本..."
            python3 ofiii_epg.py "${EPG_OUTPUT_DIR}/ofiii.xml
            if [ -f "${EPG_OUTPUT_DIR}/ofiii.xml" ]; then
              echo "✅ 成功生成 ofiii.xml"
              echo "ofiii_generated=true" >> $GITHUB_OUTPUT
              echo "ofiii EPG updated at $(date '+%Y-%m-%d %H:%M:%S')" > ofiii_time.txt
            else
              echo "⚠️ 未生成 ofiii.xml"
              echo "ofiii_generated=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ ofiii_epg.py 不存在，跳过"
            echo "ofiii_generated=false" >> $GITHUB_OUTPUT
          fi

      # ---------- 5. 检查并运行 PHP 采集脚本 ----------
      - name: Check PHP scripts existence
        id: check_scripts
        run: |
          echo "检查 PHP 脚本文件..."
          declare -a scripts=(
            "51zmt_epg.php" "cntvepg.php" "epg_4k.php" "epg_elta.php"
            "kbro_epg.php" "mod.php" "nowtv_epg.php"
            "rthk.php" "tdm_epg.php" "zhongtianam.php"
          )
          existing_scripts=()
          for script in "${scripts[@]}"; do
            if [ -f "$script" ]; then
              echo "✓ 找到文件: $script"
              existing_scripts+=("$script")
            else
              echo "✗ 文件不存在: $script"
            fi
          done
          if [ ${#existing_scripts[@]} -eq 0 ]; then
            echo "警告: 没有找到任何 PHP 脚本文件，跳过 EPG 生成"
            echo "existing_scripts=" >> $GITHUB_OUTPUT
          else
            scripts_list=$(IFS=,; echo "${existing_scripts[*]}")
            echo "existing_scripts=$scripts_list" >> $GITHUB_OUTPUT
          fi

      - name: Run PHP scripts to generate EPG XML
        if: ${{ steps.check_scripts.outputs.existing_scripts != '' }}
        id: run_php_scripts
        continue-on-error: true
        run: |
          IFS=',' read -ra scripts <<< "${{ steps.check_scripts.outputs.existing_scripts }}"
          failed_scripts=()
          success_count=0

          for script in "${scripts[@]}"; do
            echo "========================================="
            echo "正在运行: $script"
            start_time=$(date +%s)
            log_file="logs/${script%.php}.log"

            if php "$script" > "$log_file" 2>&1; then
              end_time=$(date +%s)
              duration=$((end_time - start_time))
              echo "✓ $script 执行成功 (耗时: ${duration}秒)"
              success_count=$((success_count + 1))
            else
              end_time=$(date +%s)
              duration=$((end_time - start_time))
              echo "✗ $script 执行失败！(耗时: ${duration}秒)"
              failed_scripts+=("$script")
              echo "--- 最后 20 行日志 ---"
              tail -n 20 "$log_file" 2>/dev/null || echo "无法读取日志文件"
              echo "----------------------"
            fi
            echo "========================================="
          done

          echo "执行完成: 成功 ${success_count} 个，失败 ${#failed_scripts[@]} 个"
          if [ ${#failed_scripts[@]} -gt 0 ]; then
            echo "失败脚本列表: ${failed_scripts[*]}"
          fi
          echo "php_failed_count=${#failed_scripts[@]}" >> $GITHUB_OUTPUT

      # ---------- 6. 检查生成的 XML 文件 ----------
      - name: Check generated XML files
        id: check_xml
        run: |
          declare -a expected_xml=(
            "4g.xml" "cntv.xml.gz" "epg_4k.xml" "epg_elta.xml"
            "epg_nowtv.xml" "epg_zhongtiannam.xml" "hami.xml" "litv_epg.xml"
            "ofiii.xml" "epg_rthk_tv.xml" "kbro_epg.xml" "mod_epg.xml"
            "tdm_epg.xml"
          )

          generated_files=()
          valid_xml=0
          invalid_xml=0

          echo "开始检查生成的 XML 文件（目录：${EPG_OUTPUT_DIR}）..."
          for xml_file in "${expected_xml[@]}"; do
            file_path="${EPG_OUTPUT_DIR}/${xml_file}"
            if [ -f "$file_path" ]; then
              filesize=$(stat -c%s "$file_path" 2>/dev/null || wc -c < "$file_path" | awk '{print $1}')
              echo "✓ 生成文件: $file_path (大小: $filesize bytes)"
              generated_files+=("$file_path")

              if [[ "$xml_file" != *.gz ]]; then
                if xmllint --noout "$file_path" 2>/dev/null; then
                  echo "  ✅ XML 格式验证通过"
                  valid_xml=$((valid_xml + 1))
                else
                  echo "  ❌ XML 格式验证失败！"
                  invalid_xml=$((invalid_xml + 1))
                fi
              fi
            else
              echo "✗ 未生成文件: $file_path"
            fi
          done

          echo "已生成文件数量: ${#generated_files[@]}"
          echo "格式合法: $valid_xml 个，格式异常: $invalid_xml 个"

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "generated_xml=" >> $GITHUB_OUTPUT
          else
            xml_list=$(IFS=,; echo "${generated_files[*]}")
            echo "generated_xml=$xml_list" >> $GITHUB_OUTPUT
          fi
          echo "valid_xml_count=$valid_xml" >> $GITHUB_OUTPUT
          echo "invalid_xml_count=$invalid_xml" >> $GITHUB_OUTPUT

      # ---------- 7. 更新时间戳 ----------
      - name: Update time.txt with latest timestamp
        if: ${{ steps.check_xml.outputs.generated_xml != '' }}
        run: |
          echo "Last XML update: $(date '+%Y-%m-%d %H:%M:%S')" > time.txt
          echo "时间戳已更新: $(cat time.txt)"

      # ---------- 8. 提交结果并推送回仓库 ----------
      - name: Commit and push all generated files
        run: |
          shopt -s nullglob

          # 分别收集各类文件
          xml_files=(${EPG_OUTPUT_DIR}/*.xml)
          gz_files=(${EPG_OUTPUT_DIR}/*.xml.gz)
          time_files=(*_time.txt)

          # 存在文件才执行 git add
          if [ ${#xml_files[@]} -gt 0 ]; then
            git add "${xml_files[@]}"
          fi
          if [ ${#gz_files[@]} -gt 0 ]; then
            git add "${gz_files[@]}"
          fi
          if [ ${#time_files[@]} -gt 0 ]; then
            git add "${time_files[@]}"
          fi

          # 固定添加 time.txt 和 logs 目录
          [ -f time.txt ] && git add time.txt
          [ -d logs/ ] && git add logs/

          shopt -u nullglob

          if git diff --cached --quiet; then
            echo "无新增变更，跳过提交"
            exit 0
          fi

          git commit -m "bot: 更新 EPG 数据 $(date '+%Y-%m-%d %H:%M')"
          git push origin ${{ github.ref_name }}
          echo "✅ 所有生成结果已推送回仓库"

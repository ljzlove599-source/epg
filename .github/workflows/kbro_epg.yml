name: 采集 kbro EPG 节目单

on:
  # 定时执行：北京时间每天 00:30 自动运行
  # UTC 时间 = 北京时间 - 8小时
  schedule:
    - cron: '30 16 * * *'
  
  # 支持手动触发
  workflow_dispatch:

# 任务权限：允许写入仓库内容
permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest
    name: 生成 kbro XMLTV 文件

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 PHP 环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          tools: none

      - name: 验证 PHP 环境
        run: php -v

      - name: 运行 EPG 采集脚本
        run: php kbro_epg.php

      - name: 上传生成的 XML 工件
        uses: actions/upload-artifact@v4
        with:
          name: kbro_epg.xml
          path: epg_sources/kbro_epg.xml
          retention-days: 7

      - name: 提交更新到仓库
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add epg_sources/kbro_epg.xml
          # 对比暂存区与HEAD，有差异才提交
          git diff --quiet --cached && echo "无更新，跳过提交" || git commit -m "自动更新 kbro EPG 节目单 $(date +'%Y-%m-%d')"
          git push

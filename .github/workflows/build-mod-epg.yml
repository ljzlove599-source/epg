name: 中华电信MOD EPG 生成

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      max_week:
        description: '抓取周数：0=本周7天，1=两周共14天'
        required: false
        default: '1'
        type: choice
        options:
          - '0'
          - '1'

jobs:
  build:
    runs-on: ubuntu-latest
    name: 生成 EPG XML 文件

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 PHP 运行环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, xml
          ini-values: max_execution_time=0, memory_limit=512M

      - name: 动态同步抓取周数配置
        if: github.event.inputs.max_week != ''
        run: |
          # 这里改成你实际的脚本文件路径，比如 php/mod.php
          sed -i "s/define('MAX_WEEK', [0-9]);/define('MAX_WEEK', ${{ github.event.inputs.max_week }});/" mod.php

      - name: 运行采集脚本生成 XML
        run: php mod.php # 改成你实际的脚本文件名和路径，比如 php/mod.php

      - name: 上传生成的 EPG 产物
        uses: actions/upload-artifact@v4
        with:
          name: mod_epg_xml
          path: mod_epg.xml # 根目录输出，直接写文件名即可
          retention-days: 30

      # 可选：自动提交回仓库
      - name: 提交 XML 文件到仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '自动更新：MOD 节目单 EPG'
          file_pattern: 'mod_epg.xml'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'

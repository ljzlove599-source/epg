name:  NowTV EPG 自动生成
on:
  schedule:
    - cron: '0 17 * * *'  # 每天 UTC 0 点执行
  workflow_dispatch:      # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, xmlwriter

      - name: Run EPG Script
        run: php nowtv_epg.php

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/epg_nowtv.xml
          git commit -m "Auto update NowTV EPG" || exit 0
          git push


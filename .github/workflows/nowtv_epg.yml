name: Now TV EPG 自动生成

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 授予写仓库权限

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP 环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, simplexml, json, dom

      - name: 运行 EPG 采集脚本
        run: php nowtv_epg.php

      - name: 提交并推送 XML 文件到仓库
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/epg_nowtv.xml
          git diff --quiet && echo "无变更，跳过提交" && exit 0
          git commit -m "chore: 自动更新 NowTV EPG 节目单"
          git push

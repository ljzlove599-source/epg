name: Daily ofiii EPG Update

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pytz opencc-python-reimplemented
        pip list
        
    - name: Create output directory
      run: mkdir -p epg
      
    - name: Generate EPG
      run: |
        echo "开始生成EPG数据..."
        python scripts/ofiii_epg.py --output epg/ofiii.xml
        echo "EPG生成完成"
        
    - name: Verify generated files
      run: |
        echo "检查生成的文件:"
        ls -la epg/
        echo "XML 文件大小: $(wc -c < epg/ofiii.xml) 字节"
        
    - name: Configure Git
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions"
        
    - name: Commit and push EPG data
      run: |
        # 添加生成的文件
        git add epg/ofiii.xml
        
        # 检查是否有变更
        if git diff --staged --quiet; then
          echo "没有EPG数据变更"
        else
          # 提交变更
          git commit -m "Auto-update EPG data [$(date +'%Y-%m-%d %H:%M')]"
          
          # 推送变更
          git push
          echo "✅ EPG数据已成功更新并推送"
        fi

name: EPG 自动更新程序，新增file.json

on:
  schedule:
    - cron: '40 16 * * *' # UTC 16:40 = 北京时间 次日 00:40
    - cron: '00 00 * * *' # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:

# 并发锁：同一分支同一时间只跑一个任务，新任务自动取消进行中的旧任务
concurrency:
  group: epg-auto-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  EPG_OUTPUT_DIR: epg_sources
  LOG_DIR: logs
  PHP_SCRIPT_DIR: php
  PHP_VERSION: '7.4'
  PYTHON_VERSION: '3.11'
  PHP_PARALLEL_TIMEOUT: 300 # 单PHP脚本最大超时 5分钟，防止卡死

jobs:
  epg_comprehensive_processing:
    runs-on: ubuntu-latest
    steps:
      # ---------- 1. 拉取代码与 Git 配置 ----------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ---------- 2. 安装系统与语言环境 ----------
      - name: Install system dependencies
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y jq libxml2-utils gzip timeout

      - name: Set up PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer
          ini-values: date.timezone=Asia/Shanghai

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install project dependencies
        run: |
          set -eo pipefail
          if [ -f "composer.json" ]; then
            composer install --no-dev --no-progress --no-interaction --prefer-dist
          fi
          pip install opencc-python-reimplemented curl_cffi beautifulsoup4 requests aiohttp pytz loguru httpx
          echo "所有依赖安装完成"

      # ---------- 3. 清理历史残留文件 ----------
      - name: Clean old output files
        run: |
          set -eo pipefail
          if [ -d "${EPG_OUTPUT_DIR}" ]; then
            rm -f ${EPG_OUTPUT_DIR}/*.xml ${EPG_OUTPUT_DIR}/*.xml.gz
          fi
          rm -f *_time.txt time.txt
          rm -rf ${LOG_DIR}/
          mkdir -p ${LOG_DIR} ${EPG_OUTPUT_DIR}
          echo "历史文件清理完成，输出目录：${EPG_OUTPUT_DIR}，日志目录：${LOG_DIR}"

      # ---------- 4. 下载 files.json 中定义的文件并解压 ----------
      - name: Download and extract files from files.json (via Python)
        id: download_files
        env:
          FILES_JSON: ${{ secrets.FILES_JSON }}
        run: |
          set -eo pipefail
          python3 - <<'EOF'
          import os
          import json
          import urllib.request
          import gzip
          import shutil

          output_dir = os.environ.get('EPG_OUTPUT_DIR', 'epg_sources')
          os.makedirs(output_dir, exist_ok=True)

          files_json_str = os.environ.get('FILES_JSON', '')
          if not files_json_str:
              print("錯誤: FILES_JSON secret 未設置，請在仓库 Secrets 中添加")
              exit(1)

          try:
              files_dict = json.loads(files_json_str)
          except Exception as e:
              print(f"錯誤: FILES_JSON 解析 JSON 失敗: {e}")
              exit(1)

          print("開始下載 files.json 中定義的文件...")
          for filename, url in files_dict.items():
              file_path = os.path.join(output_dir, filename)
              print(f"下載: {filename} <- {url}")
              try:
                  req = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
                  )
                  with urllib.request.urlopen(req, timeout=30) as response, open(file_path, 'wb') as out_file:
                      shutil.copyfileobj(response, out_file)
                  print(f"✓ 下載成功: {file_path}")
              except Exception as e:
                  print(f"⚠️ {filename} 下載失敗，跳過: {e}")
                  continue

              if filename.endswith('.gz') and os.path.exists(file_path):
                  print(f"解壓文件: {filename}")
                  extracted_name = filename[:-3]
                  extracted_path = os.path.join(output_dir, extracted_name)
                  try:
                      with gzip.open(file_path, 'rb') as f_in, open(extracted_path, 'wb') as f_out:
                          shutil.copyfileobj(f_in, f_out)
                      if os.path.exists(extracted_path):
                          print(f"✓ 解壓成功: {extracted_path}")
                  except Exception as e:
                      print(f"⚠️ 解壓失敗: {filename}, 錯誤: {e}")

          print("文件下載和解壓完成")
          EOF

      # ---------- 5. 运行 Python 采集脚本（串行） ----------
      - name: Run all Python scrapers
        id: python_scrapers
        run: |
          set -eo pipefail
          run_python_scraper() {
            local script_name=$1
            local output_file=$2
            local extra_args=$3
            local id_name=$4

            if [ ! -f "${script_name}" ]; then
              echo "⚠️ ${script_name} 不存在，跳过"
              echo "${id_name}_generated=false" >> $GITHUB_OUTPUT
              return 0
            fi

            echo "运行 ${script_name} 抓取脚本..."
            python3 ${script_name} ${extra_args} "${EPG_OUTPUT_DIR}/${output_file}"
            local exit_code=$?

            if [ ${exit_code} -eq 0 ] && [ -f "${EPG_OUTPUT_DIR}/${output_file}" ]; then
              echo "✅ 成功生成 ${output_file}"
              echo "${id_name}_generated=true" >> $GITHUB_OUTPUT
              echo "${id_name} EPG updated at $(date '+%Y-%m-%d %H:%M:%S')" > "${id_name}_time.txt"
              return 0
            else
              echo "⚠️ 生成 ${output_file} 失败（退出码：${exit_code}）"
              echo "${id_name}_generated=false" >> $GITHUB_OUTPUT
              return 1
            fi
          }

          failed_count=0
          run_python_scraper "fourgtv_epg.py" "4g.xml" "" "fourgtv" || failed_count=$((failed_count + 1))
          run_python_scraper "hami.py" "hami.xml" "$(date '+%Y-%m-%d')" "hami" || failed_count=$((failed_count + 1))
          run_python_scraper "litv_epg_merged.py" "litv_epg.xml" "$(date '+%Y-%m-%d')" "litv" || failed_count=$((failed_count + 1))
          run_python_scraper "ofiii_epg.py" "ofiii.xml" "" "ofiii" || failed_count=$((failed_count + 1))

          echo "python_failed_count=${failed_count}" >> $GITHUB_OUTPUT
          echo "Python 脚本执行完成，失败 ${failed_count} 个"

      # ---------- 6. 检查并运行 PHP 采集脚本（并行 + 超时保护） ----------
      - name: Check PHP scripts existence
        id: check_scripts
        run: |
          set -eo pipefail
          echo "检查 PHP 脚本文件（目录：${PHP_SCRIPT_DIR}）..."
          declare -a scripts=(
            "51zmt_epg.php" "cntvepg.php" "epg_4k.php" "epg_elta.php"
            "kbro_epg.php" "mod.php" "nowtv_epg.php"
            "rthk.php" "tdm_epg.php" "zhongtianam.php"
          )
          existing_scripts=()
          for script in "${scripts[@]}"; do
            script_path="${PHP_SCRIPT_DIR}/${script}"
            if [ -f "$script_path" ]; then
              echo "✓ 找到文件: $script_path"
              existing_scripts+=("$script_path")
            else
              echo "✗ 文件不存在: $script_path"
            fi
          done
          if [ ${#existing_scripts[@]} -eq 0 ]; then
            echo "警告: 没有找到任何 PHP 脚本文件，跳过 EPG 生成"
            echo "existing_scripts=" >> $GITHUB_OUTPUT
          else
            scripts_list=$(IFS=,; echo "${existing_scripts[*]}")
            echo "existing_scripts=$scripts_list" >> $GITHUB_OUTPUT
          fi

      - name: Run PHP scripts to generate EPG XML (parallel with timeout)
        if: ${{ steps.check_scripts.outputs.existing_scripts != '' }}
        id: run_php_scripts
        run: |
          set -eo pipefail
          IFS=',' read -ra scripts <<< "${{ steps.check_scripts.outputs.existing_scripts }}"
          pids=()
          logpaths=()
          start_time=$(date +%s)

          for script in "${scripts[@]}"; do
            log_name=$(basename "${script%.php}")
            log_file="${LOG_DIR}/${log_name}.log"
            logpaths+=("$log_file")
            echo "启动脚本: $script (超时${{ env.PHP_PARALLEL_TIMEOUT }}s)"
            timeout ${{ env.PHP_PARALLEL_TIMEOUT }} php "$script" > "$log_file" 2>&1 &
            pids+=("$!")
          done

          failed_count=0
          for i in "${!scripts[@]}"; do
            wait ${pids[$i]}
            exit_code=$?
            script=${scripts[$i]}
            log_name=$(basename "${script%.php}")
            if [ ${exit_code} -eq 0 ]; then
              echo "✓ ${log_name} 执行成功"
            elif [ ${exit_code} -eq 124 ]; then
              echo "⏱️ ${log_name} 执行超时！"
              echo "--- 日志 ---"
              tail -n 20 "${logpaths[$i]}" 2>/dev/null || true
              failed_count=$((failed_count + 1))
            else
              echo "✗ ${log_name} 执行失败（退出码：${exit_code}）"
              echo "--- 最后 20 行日志 ---"
              tail -n 20 "${logpaths[$i]}" 2>/dev/null || echo "无法读取日志文件"
              echo "----------------------"
              failed_count=$((failed_count + 1))
            fi
          done

          end_time=$(date +%s)
          total_duration=$((end_time - start_time))
          echo "PHP 脚本执行完成: 成功 $((${#scripts[@]} - failed_count)) 个，失败 ${failed_count} 个，总耗时: ${total_duration}秒"
          echo "php_failed_count=${failed_count}" >> $GITHUB_OUTPUT

      # ---------- 7. 检查生成的 XML 文件（含 GZ 内 XML 校验） ----------
      - name: Check generated XML files
        id: check_xml
        run: |
          set -eo pipefail
          declare -a expected_xml=(
            "4g.xml" "cntv.xml.gz" "epg_4k.xml" "epg_elta.xml"
            "epg_nowtv.xml" "epg_zhongtianam.xml" "hami.xml" "litv_epg.xml"
            "ofiii.xml" "epg_rthk_tv.xml" "kbro_epg.xml" "mod_epg.xml"
            "tdm_epg.xml"
          )

          generated_files=()
          valid_xml=0
          invalid_xml=0

          echo "开始检查生成的 XML 文件（目录：${EPG_OUTPUT_DIR}）..."
          for xml_file in "${expected_xml[@]}"; do
            file_path="${EPG_OUTPUT_DIR}/${xml_file}"
            if [ -f "$file_path" ]; then
              filesize=$(stat -c%s "$file_path" 2>/dev/null || wc -c < "$file_path" | awk '{print $1}')
              echo "✓ 生成文件: $file_path (大小: $filesize bytes)"
              generated_files+=("$file_path")

              # 普通XML直接校验，GZ文件通过管道解压后校验
              if [[ "$xml_file" == *.gz ]]; then
                if gzip -dc "$file_path" | xmllint --noout - 2>/dev/null; then
                  echo "  ✅ GZ 内 XML 格式验证通过"
                  valid_xml=$((valid_xml + 1))
                else
                  echo "  ❌ GZ 内 XML 格式验证失败！"
                  invalid_xml=$((invalid_xml + 1))
                fi
              else
                if xmllint --noout "$file_path" 2>/dev/null; then
                  echo "  ✅ XML 格式验证通过"
                  valid_xml=$((valid_xml + 1))
                else
                  echo "  ❌ XML 格式验证失败！"
                  invalid_xml=$((invalid_xml + 1))
                fi
              fi
            else
              echo "✗ 未生成文件: $file_path"
            fi
          done

          echo "已生成文件数量: ${#generated_files[@]}"
          echo "格式合法: $valid_xml 个，格式异常: $invalid_xml 个"

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "generated_xml=" >> $GITHUB_OUTPUT
          else
            xml_list=$(IFS=,; echo "${generated_files[*]}")
            echo "generated_xml=$xml_list" >> $GITHUB_OUTPUT
          fi
          echo "valid_xml_count=$valid_xml" >> $GITHUB_OUTPUT
          echo "invalid_xml_count=$invalid_xml" >> $GITHUB_OUTPUT

      # ---------- 8. 更新时间戳 ----------
      - name: Update time.txt with latest timestamp
        if: ${{ steps.check_xml.outputs.generated_xml != '' }}
        run: |
          set -eo pipefail
          echo "Last XML update: $(date '+%Y-%m-%d %H:%M:%S')" > time.txt
          echo "时间戳已更新: $(cat time.txt)"

      # ---------- 9. 提交结果并推送回仓库 ----------
      - name: Commit and push all generated files
        run: |
          set -eo pipefail
          # 提交前同步远端代码，避免冲突
          git pull --rebase --autostash origin ${{ github.ref_name }} || git reset --hard origin/${{ github.ref_name }}

          shopt -s nullglob
          xml_files=(${EPG_OUTPUT_DIR}/*.xml)
          gz_files=(${EPG_OUTPUT_DIR}/*.xml.gz)
          time_files=(*_time.txt)

          [ ${#xml_files[@]} -gt 0 ] && git add "${xml_files[@]}"
          [ ${#gz_files[@]} -gt 0 ] && git add "${gz_files[@]}"
          [ ${#time_files[@]} -gt 0 ] && git add "${time_files[@]}"
          [ -f time.txt ] && git add time.txt
          # 如需提交运行日志请取消下一行注释
          # [ -d ${LOG_DIR}/ ] && git add ${LOG_DIR}/
          shopt -u nullglob

          if git diff --cached --quiet; then
            echo "无新增变更，跳过提交"
            exit 0
          fi

          git commit -m "bot: 更新 EPG 数据 $(date '+%Y-%m-%d %H:%M')"
          git push origin ${{ github.ref_name }}
          echo "✅ 所有生成结果已推送回仓库"

      # ---------- 10. 结果汇总 + 失败判定 ----------
      - name: Run summary
        run: |
          set -eo pipefail
          echo "====== EPG 采集任务汇总 ======"
          echo "Python 脚本失败数: ${{ steps.python_scrapers.outputs.python_failed_count }}"
          echo "PHP 脚本失败数: ${{ steps.run_php_scripts.outputs.php_failed_count }}"
          echo "生成 XML 文件数: ${{ steps.check_xml.outputs.valid_xml_count }}"
          echo "XML 格式异常数: ${{ steps.check_xml.outputs.invalid_xml_count }}"
          echo "=============================="

          total_failed=$(( ${{ steps.python_scrapers.outputs.python_failed_count }} + ${{ steps.run_php_scripts.outputs.php_failed_count }} ))
          if [ ${total_failed} -ge 3 ]; then
            echo "::error::超过 3 个脚本执行失败，请检查日志"
            exit 1
          fi

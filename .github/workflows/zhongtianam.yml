name: 中天EPG自动生成
on:
  # 手动触发（网页点 Run workflow）
  workflow_dispatch:
  # 定时：每天 05:00 UTC = 13:00 台北时间，可自行改
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,json,dom,xml
          coverage: none

      - name: 运行PHP脚本生成EPG
        run: php zhongtianam.php

      - name: 提交更新的xml
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add epgzhongtianam.xml
          git commit -m "🤖 Auto update epg_zhongtianam.xml" || echo "无变更，跳过提交"
          git push

name: CNTV EPG 自动更新

on:
  schedule:
    - cron: '0 17 * * *'  # UTC 17:00 = 北京时间 01:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP 环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, xmlwriter, zlib, json, mbstring
          coverage: none

      - name: 验证 PHP 环境
        run: php -v && php -m

      - name: 运行 EPG 抓取脚本
        run: php cntvepg.php

      - name: 文件完整性校验
        run: |
          FILE="epg/cntv.xml.gz"
          if [ ! -f "$FILE" ]; then
            echo "::error::输出文件不存在"
            exit 1
          fi

          echo "文件大小：$(du -h "$FILE" | cut -f1)"
          
          # 校验 gzip 格式
          if ! gzip -t "$FILE"; then
            echo "::error::gzip 文件损坏"
            exit 1
          fi
          echo "✅ gzip 格式校验通过"

          # 校验 XML 合法性
          XML_HEAD=$(gzip -dc "$FILE" | head -n 1)
          if echo "$XML_HEAD" | grep -q '<?xml version'; then
            echo "✅ XML 头部正常"
          else
            echo "::error::XML 内容非法"
            exit 1
          fi

          # 统计节目数量
           PROG_COUNT=$(gzip -dc "$FILE" | grep -c '<programme' || true)
           echo "📺 节目条目数：$PROG_COUNT"

          # 只要存在有效节目即视为合格，适配接口不稳定场景
           if [ "$PROG_COUNT" -lt 1 ]; then
           echo "::error::无任何有效节目数据"
          exit 1
          fi


      - name: 提交并推送结果
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add epg/cntv.xml.gz
          git commit -m "更新 CNTV EPG 数据 $(date '+%Y-%m-%d %H:%M') [skip ci]"
          git push



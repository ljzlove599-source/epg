name: LiTV EPG 每日抓取任务

on:
  schedule:
    # 每日 UTC 时间 08:00（北京时间 16:00）执行
    - cron: '0 08 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  crawl-epg:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # 赋予仓库写入权限
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run EPG crawler
      run: python litv_epg.py
      continue-on-error: true

    - name: 检查输出文件是否存在
      id: check_file
      run: |
        if [ -f "epg/litv.xml" ]; then
          echo "file_exists=true" >> $GITHUB_OUTPUT
          echo "file_size=$(wc -c < epg/litv.xml)" >> $GITHUB_OUTPUT
          echo "File exists with size: $(ls -lh epg/litv.xml | awk '{print $5}')"
        else
          echo "file_exists=false" >> $GITHUB_OUTPUT
          echo "file_size=0" >> $GITHUB_OUTPUT
          echo "Output file not found!"
        fi

    - name: Upload EPG file as artifact
      if: steps.check_file.outputs.file_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: litv-epg
        path: epg/litv.xml
        retention-days: 7

    - name: 提交并推送文件变更
      if: steps.check_file.outputs.file_exists == 'true' && steps.check_file.outputs.file_size > 0
      run: |
        # 配置 Git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 检查文件与上次提交是否有差异
        if git diff --quiet HEAD epg/litv.xml 2>/dev/null; then
          echo "No changes to commit"
        else
          # 添加并提交
          git add epg/litv.xml
          git commit -m "Auto-update: LiTV EPG data $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          
          # 推送变更
          git push
        fi

    - name: 发送成功通知
      if: success()
      run: |
        echo "🎉 LiTV EPG 更新成功！"
        echo "📅 更新时间: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
        if [ -f "epg/litv.xml" ]; then
          echo "📁 文件路径: epg/litv.xml"
          echo "📊 文件大小: $(ls -lh epg/litv.xml | awk '{print $5}')"
        fi

    - name: 发送失败通知
      if: failure()
      run: |
        echo "❌ LiTV EPG 更新失败！"
        echo "📅 失败时间: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
        echo "请查看 GitHub Actions 日志获取详细信息。"



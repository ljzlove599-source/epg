name: LiTV EPG 每日生成

# 触发规则
on:
  # 定时触发：每日 UTC 22:00 = 北京时间次日 06:00
  schedule:
    - cron: '0 22 * * *'
  
  # 手动触发（可在 Actions 页面手动运行）
  workflow_dispatch:
    inputs:
      days:
        description: '抓取节目天数'
        required: false
        default: '7'
        type: string
      force_update:
        description: '是否强制更新数据库'
        required: false
        default: 'true'
        type: boolean

# 全局环境变量
env:
  TZ: Asia/Shanghai
  PYTHON_VERSION: '3.11'

# 任务
jobs:
  build-epg:
    runs-on: ubuntu-latest
    name: 生成 LiTV EPG 节目表
    
    steps:
      # 1. 检出代码
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # 3. 安装依赖
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install httpx opencc-python-reimplemented

      # 4. 运行 EPG 抓取脚本
      - name: 执行 EPG 抓取与生成
        run: |
          echo "当前时区: $(date +"%Z %z")"
          echo "开始时间: $(date)"
          python litv_epg_merged.py
          echo "结束时间: $(date)"
        env:
          # 可通过环境变量覆盖代码中的 Config 配置
          DAYS: ${{ github.event.inputs.days || '7' }}

      # 5. 校验输出文件
      - name: 校验输出结果
        run: |
          if [ -f epg/litv_epg.xml ]; then
            echo "✅ EPG 文件生成成功"
            echo "文件大小: $(du -h epg/litv_epg.xml | cut -f1)"
            echo "频道数: $(grep -c '<channel ' epg/litv_epg.xml)"
            echo "节目数: $(grep -c '<programme ' epg/litv_epg.xml)"
          else
            echo "❌ EPG 文件生成失败"
            exit 1
          fi

      # 6. 上传构建产物（保留 90 天，可在 Actions 页面下载）
      - name: 上传 EPG 产物
        uses: actions/upload-artifact@v4
        with:
          name: litv-epg-xml
          path: epg/litv_epg.xml
          retention-days: 90
          compression-level: 6

      # ========== 可选：自动提交生成的 EPG 到仓库 ==========
      # 取消下面注释即可启用，启用后每次运行会自动把 xml 提交回仓库
      # 可通过 GitHub Raw 链接直接访问 EPG 文件
      # - name: 提交 EPG 文件到仓库
      #   uses: EndBug/add-and-commit@v9
      #   with:
      #     add: 'epg/litv_epg.xml'
      #     message: 'chore: 自动更新 LiTV EPG 节目表'
      #     default_author: github_actions
      #     push: true
      # =====================================================

name: LiTV EPG 每日生成

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '抓取节目天数'
        required: false
        default: '7'
        type: string

env:
  TZ: Asia/Shanghai
  PYTHON_VERSION: '3.11'

# 关键：给工作流授予仓库写入权限
permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest
    name: 生成 LiTV EPG 节目表
    
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install httpx opencc-python-reimplemented

      - name: 执行 EPG 抓取与生成
        run: |
          echo "当前时区: $(date +"%Z %z")"
          echo "开始时间: $(date)"
          python litv_epg_merged.py
          echo "结束时间: $(date)"
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}

      - name: 校验输出结果
        run: |
          if [ -f epg/litv_epg.xml ]; then
            echo "✅ EPG 文件生成成功"
            echo "文件大小: $(du -h epg/litv_epg.xml | cut -f1)"
            echo "频道数: $(grep -c '<channel ' epg/litv_epg.xml)"
            echo "节目数: $(grep -c '<programme ' epg/litv_epg.xml)"
          else
            echo "❌ EPG 文件生成失败"
            exit 1
          fi

      # 核心：自动提交回仓库
      - name: 提交 EPG 文件到仓库
        uses: EndBug/add-and-commit@v9
        with:
          add: 'epg/litv_epg.xml'
          message: 'chore: 自动更新 LiTV EPG 节目表'
          default_author: github_actions
          push: true

      - name: 上传 EPG 产物
        uses: actions/upload-artifact@v4
        with:
          name: litv-epg-xml
          path: epg/litv_epg.xml
          retention-days: 90
          compression-level: 6
